name: 执行实验

# 两个 job 分离权限：
#   run    —— 执行实验代码：只读 token、不挂任何 secrets、不保留 git 凭证
#   record —— 只把结果 JSON 提交回 PR 分支：有写权限，但不执行任何实验代码

on:
  pull_request:
    paths:
      - "experiments/**"
      - "!experiments/**/result.json"
  workflow_dispatch:
    inputs:
      experiment:
        description: "要重跑的实验 id（留空则跑全部缺少结果的实验）"
        required: false

concurrency:
  group: experiments-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 找出需要执行的实验
        id: find
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- experiments/ \
              | grep -v '/result.json$' | cut -d/ -f2 | sort -u > list.txt || true
          elif [ -n "${{ inputs.experiment }}" ]; then
            echo "${{ inputs.experiment }}" > list.txt
          else
            for d in experiments/*/; do
              [ -f "$d/experiment.json" ] && [ ! -f "$d/result.json" ] && basename "$d"
            done > list.txt || true
          fi
          # 只保留真实存在的实验目录
          : > ids.txt
          while read -r id; do
            [ -n "$id" ] && [ -f "experiments/$id/experiment.json" ] && echo "$id" >> ids.txt
          done < list.txt
          cat ids.txt
          echo "count=$(wc -l < ids.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.find.outputs.count != '0'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.find.outputs.count != '0'
        with:
          node-version: "22"

      - name: 执行
        if: steps.find.outputs.count != '0'
        run: |
          mkdir -p results
          while read -r id; do
            python scripts/run_experiment.py "experiments/$id" --out "results/$id.json"
          done < ids.txt

      - uses: actions/upload-artifact@v4
        if: steps.find.outputs.count != '0'
        with:
          name: experiment-results
          path: results/
          retention-days: 14

  record:
    needs: run
    if: >-
      needs.run.outputs.count != '0' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: experiment-results
          path: results

      - name: 写入 result.json 并提交
        run: |
          echo "<!-- ai-daily-experiments -->" > comment.md
          echo "## 🧪 实验执行结果" >> comment.md
          echo "" >> comment.md
          echo "| 实验 | 状态 | 耗时 | 说明 |" >> comment.md
          echo "|---|---|---|---|" >> comment.md
          for f in results/*.json; do
            id=$(basename "$f" .json)
            # 只接受合法的实验 id，防止路径穿越
            if ! echo "$id" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9-]*$'; then continue; fi
            [ -d "experiments/$id" ] || continue
            cp "$f" "experiments/$id/result.json"
            status=$(jq -r .status "$f"); dur=$(jq -r '.duration_seconds // ""' "$f"); why=$(jq -r '.failure // ""' "$f")
            case "$status" in passed) s="✅ 已验证";; partial) s="⚠️ 部分可用";; *) s="❌ 失败";; esac
            echo "| \`$id\` | $s | ${dur}s | $why |" >> comment.md
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/*/result.json
          if git diff --cached --quiet; then
            echo "结果无变化"
          else
            git commit -m "chore: 记录实验执行结果"
            git push
          fi

      - name: 在 PR 中发布实验结果
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                 --jq '.[] | select(.body | startswith("<!-- ai-daily-experiments -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          fi
