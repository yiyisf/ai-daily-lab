<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Daily Lab{% endblock %}</title>
<meta name="description" content="{% block description %}每日 AI 资讯、开源项目、业界讨论与可验证实验{% endblock %}">
<script>(function(){var r=document.documentElement;r.classList.remove('no-js');try{var p=localStorage.getItem('theme')||'system';r.setAttribute('data-theme-pref',p);if(p!=='system')r.setAttribute('data-theme',p);}catch(e){r.setAttribute('data-theme-pref','system');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="{{ root }}assets/style.css">
<link rel="alternate" type="application/atom+xml" title="AI Daily Lab" href="{{ root }}feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='4' y='4' width='14' height='14' rx='3' transform='rotate(45 11 11)' fill='%23C2410C'/%3E%3C/svg%3E">
<script src="{{ root }}assets/app.js" defer></script>
</head>
<body data-root="{{ root }}">
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ root }}index.html">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect class="brand-mark" x="4" y="4" width="14" height="14" rx="3" transform="rotate(45 11 11)"/></svg>
      <span class="brand-text">AI Daily Lab</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="{{ root }}index.html" {% if nav == 'today' %}aria-current="page"{% endif %}>今日</a>
      <a href="{{ root }}archive.html" {% if nav == 'archive' %}aria-current="page"{% endif %}>往期</a>
      <a href="{{ root }}tags/index.html" {% if nav == 'tags' %}aria-current="page"{% endif %}>标签</a>
      <a href="{{ root }}experiments/index.html" {% if nav == 'experiments' %}aria-current="page"{% endif %}>实验室</a>
    </nav>
    <span class="header-spacer"></span>
    <button type="button" class="search-btn js-only js-search" aria-label="搜索（Ctrl/⌘ + K）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="search-label">搜索条目、标签、日期</span>
      <span class="kbd search-kbd">⌘K</span>
    </button>
    <a class="icon-btn saved-link js-only" href="{{ root }}saved.html" aria-label="收藏夹" title="收藏夹" {% if nav == 'saved' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span class="saved-count js-saved-count" hidden></span>
    </a>
    <button type="button" class="icon-btn js-only js-help" aria-label="键盘快捷键" title="键盘快捷键（?）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
    <button type="button" class="icon-btn js-only js-theme" aria-label="切换主题" title="切换主题">
      <svg class="theme-icon system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <svg class="theme-icon light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-icon dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">内容由 Claude 自动搜集整理，经校验后发布。每条均附原始链接，请以原文为准。 · 生成于 {{ build_time }}</div>
</footer>
<div class="toast" role="status" aria-live="polite"></div>
<dialog class="palette" aria-label="搜索">
  <div class="palette-box">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" class="js-palette-input" placeholder="搜索条目、标签、日期或实验…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list">
      <span class="kbd">Esc</span>
    </div>
    <div id="palette-results" class="palette-results js-palette-results" role="listbox" aria-label="搜索结果"></div>
    <div class="palette-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> 选择</span><span><span class="kbd">Enter</span> 打开</span><span class="js-palette-count"></span></div>
  </div>
</dialog>
<dialog class="help" aria-labelledby="help-title">
  <h2 id="help-title">键盘快捷键</h2>
  <dl>
    <dt><span class="kbd">j</span> / <span class="kbd">k</span></dt><dd>下一条 / 上一条</dd>
    <dt><span class="kbd">o</span></dt><dd>展开或收起当前条目</dd>
    <dt><span class="kbd">Enter</span></dt><dd>打开当前条目详情</dd>
    <dt><span class="kbd">c</span></dt><dd>复制当前条目链接</dd>
    <dt><span class="kbd">s</span></dt><dd>收藏 / 取消收藏当前条目</dd>
    <dt><span class="kbd">/</span> 或 <span class="kbd">⌘K</span></dt><dd>搜索</dd>
    <dt><span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span></dt><dd>切换密度：标题 / 摘要 / 完整</dd>
    <dt><span class="kbd">t</span></dt><dd>切换主题</dd>
    <dt><span class="kbd">?</span></dt><dd>显示本帮助</dd>
  </dl>
  <form method="dialog"><button class="btn close">知道了</button></form>
</dialog>
</body>
</html>
